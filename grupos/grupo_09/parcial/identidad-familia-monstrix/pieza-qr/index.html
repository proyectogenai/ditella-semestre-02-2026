<title>Vestí a NODI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Baloo+2:wght@500;600;700&display=swap">
<style>
/* Layout: a snowy stage with NODI on a mound, the wardrobe as a shelf of plush buttons beside it (below it on phones). Single winter-day look on purpose. */
:root{
  color-scheme: light;
  --snow:#f5f9fd;      /* page ground */
  --frost:#e3f1f9;     /* stage sky */
  --ice:#91d3eb;       /* NODI's fur */
  --ink:#1c4f78;       /* deep celeste for text */
  --violet:#6a4bc4;
  --lilac:#d9cdf6;
  --pink:#f39ac1;
  --red:#d22b3c;       /* the family red */
  --ink-soft:#4d7697;
  --display:"Sniglet","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--snow);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.app{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:grid;gap:14px;
  grid-template-columns:1fr;grid-template-areas:"head" "stage" "shelf"}
header{grid-area:head;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3.1rem);line-height:1;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1 .nodi{color:var(--ice);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.sub{margin:0;color:var(--ink-soft);font-size:1rem;max-width:34ch}

/* stage */
.stagewrap{grid-area:stage;position:relative;border-radius:28px;overflow:hidden;
  background:
    radial-gradient(120% 38% at 50% 104%, #ffffff 58%, transparent 59%),
    radial-gradient(60% 16% at 18% 92%, #ffffff 60%, transparent 61%),
    radial-gradient(55% 14% at 86% 94%, #ffffff 60%, transparent 61%),
    linear-gradient(180deg,#cfe9f6 0%, var(--frost) 55%, #f2f8fc 100%);
  display:grid;place-items:center;padding-block:14px 6px}
.flakes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:relative;isolation:isolate;height:min(58svh,620px);max-width:100%}
.stage img{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage .layer{transform-origin:50% 100%}
.stage .layer.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.stage.boing{animation:boing .38s ease-out;transform-origin:50% 100%}
@keyframes pop{0%{transform:translateY(-14%) scale(.86);opacity:0}100%{transform:none;opacity:1}}
@keyframes boing{0%{transform:scale(1,1)}40%{transform:scale(1.03,.97)}100%{transform:scale(1,1)}}

.badge{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);
  background:var(--red);color:#fff;border-radius:18px;padding:8px 16px;font-family:var(--display);font-size:1.05rem;line-height:1.2;text-align:center;
  box-shadow:0 6px 0 #9e1d2b}
.badge small{display:block;font-family:var(--body);font-size:.85rem;opacity:.92}

/* shelf */
.shelf{grid-area:shelf;display:grid;gap:12px;align-content:start}
.shelf h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0}
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.item{appearance:none;border:0;background:#fff;border-radius:22px;padding:8px 4px 6px;cursor:pointer;
  display:grid;justify-items:center;gap:2px;color:var(--ink);font:600 .8rem/1.1 var(--body);
  box-shadow:0 4px 0 #cfe2ee;transition:transform .12s ease, box-shadow .12s ease, background .12s}
.item img{width:100%;max-width:80px;aspect-ratio:1;object-fit:contain}
.item:hover{transform:translateY(-2px)}
.item:active{transform:translateY(2px);box-shadow:0 2px 0 #cfe2ee}
.item[aria-pressed="true"]{background:var(--lilac);box-shadow:0 4px 0 var(--violet)}
.item:focus-visible,.btn:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.hint{margin:0;color:var(--ink-soft);font-size:.95rem}
.hint b{color:var(--red);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:999px;padding:10px 18px;font:700 1rem/1 var(--body);cursor:pointer;
  background:#fff;color:var(--ink);box-shadow:0 4px 0 #cfe2ee}
.btn.main{background:var(--violet);color:#fff;box-shadow:0 4px 0 #43308a}
.btn:active{transform:translateY(2px);box-shadow:none}

/* photo sheet */
.sheet{position:fixed;inset:0;background:rgba(20,48,74,.55);display:grid;place-items:center;padding:16px;z-index:10}
.sheet .card{background:var(--snow);border-radius:26px;padding:16px;display:grid;gap:12px;justify-items:center;max-width:420px;width:100%}
.sheet img{width:100%;border-radius:18px}
.sheet p{margin:0;text-align:center;color:var(--ink-soft)}

@media (min-width:860px){
  .app{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"head head" "stage shelf";align-items:start;padding-block:28px}
  .stage{height:min(74svh,700px)}
  .shelf{padding-top:8px}
}
@media (max-width:520px){.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.actions .btn{padding:10px 6px;font-size:.92rem}}
@media (prefers-reduced-motion:reduce){
  .stage .layer.pop,.stage.boing{animation:none}
  .item,.btn{transition:none}
}
</style>

<main class="app">
  <header>
    <h1>Vestí a <span class="nodi">NODI</span></h1>
    <p class="sub">Tocá una prenda para ponérsela. Tocala otra vez para sacarla.</p>
  </header>

  <section class="stagewrap" aria-label="NODI">
    <canvas class="flakes" id="paisaje" aria-hidden="true"></canvas>
    <canvas class="flakes" id="flakes" aria-hidden="true"></canvas>
    <div class="stage" id="stage"></div>
    <div class="badge" id="badge" hidden>¡Ese es NODI!<small>Bufanda y orejeras rojas: su look de siempre.</small></div>
  </section>

  <section class="shelf" aria-label="Ropero">
    <h2>El ropero</h2>
    <div class="items" id="items"></div>
    <p class="hint">Pista: hay un look que NODI <b>no se saca nunca</b>. ¿Lo encontrás?</p>
    <div class="actions">
      <button class="btn main" id="foto" type="button">Sacar foto</button>
      <button class="btn" id="sorpresa" type="button">Look sorpresa</button>
      <button class="btn" id="limpiar" type="button">Sacar todo</button>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-label="Foto de NODI">
    <img id="fotoimg" alt="NODI con el look que armaste">
    <p>Mantené apretada la foto para guardarla o compartirla.</p>
    <button class="btn main" id="cerrar" type="button">Seguir jugando</button>
  </div>
</div>

<script>
// Positions in % of the stage (LAYOUT.ar, in NODI pixel space). Body parts sit in front of some clothes.
const LAYOUT = {"ar":[495,713],"L":{"nodi":{"l":4.242,"t":13.184,"w":91.111,"z":0},"nodi_patas":{"l":25.253,"t":83.45,"w":50.303,"z":0.1},"nodi_brazos":{"l":4.242,"t":50.912,"w":91.111,"z":47},"nodi_cabeza":{"l":17.778,"t":13.184,"w":64.646,"z":45},"orejeras":{"l":10.303,"t":15.568,"w":78.99,"z":80},"gorro":{"l":18.586,"t":1.122,"w":63.03,"z":90},"miton_der":{"l":2.424,"t":63.675,"w":24.444,"z":47.6},"miton_izq":{"l":73.333,"t":63.534,"w":24.242,"z":47.6},"bota_izq":{"l":21.818,"t":78.401,"w":31.919,"z":20},"bota_der":{"l":46.667,"t":78.261,"w":32.323,"z":20.2},"chaleco":{"l":20.808,"t":46.143,"w":60.606,"z":47.5},"bufanda_atras":{"l":28.687,"t":46.985,"w":40.404,"z":35},"bufanda":{"l":17.576,"t":44.741,"w":65.455,"z":50},"bolsito":{"l":26.465,"t":50.631,"w":62.222,"z":48},"orejeras_sombra":{"l":10.303,"t":15.428,"w":78.99,"z":79.5},"gorro_sombra":{"l":18.586,"t":0.982,"w":63.232,"z":89.5},"miton_der_sombra":{"l":2.424,"t":63.534,"w":24.646,"z":47.1},"miton_izq_sombra":{"l":73.131,"t":63.394,"w":24.646,"z":47.1},"bota_izq_sombra":{"l":21.818,"t":78.401,"w":31.919,"z":19.5},"bota_der_sombra":{"l":46.667,"t":78.261,"w":32.323,"z":19.7},"chaleco_sombra":{"l":19.596,"t":46.003,"w":62.626,"z":47.0},"bufanda_atras_sombra":{"l":27.273,"t":46.283,"w":43.838,"z":34.5},"bufanda_sombra":{"l":17.576,"t":44.6,"w":65.657,"z":49.5},"bolsito_sombra":{"l":25.859,"t":50.491,"w":64.444,"z":47.5}},"items":{"bufanda":["bufanda_atras_sombra","bufanda_atras","bufanda_sombra","bufanda"],"orejeras":["orejeras_sombra","orejeras"],"gorro":["gorro_sombra","gorro"],"chaleco":["chaleco_sombra","chaleco"],"mitones":["miton_der_sombra","miton_izq_sombra","miton_der","miton_izq"],"botas":["bota_izq_sombra","bota_der_sombra","bota_izq","bota_der"],"bolsito":["bolsito_sombra","bolsito"]},"body":["nodi","nodi_patas","nodi_brazos","nodi_cabeza"],"hideWhen":{"nodi_patas":"botas"}};
const L = LAYOUT.L;

// Items: id, label, slot (one item per slot), layers drawn on NODI
const ITEMS = [
  {id:"bufanda",  name:"Bufanda",  slot:"cuello", layers:LAYOUT.items.bufanda},
  {id:"orejeras", name:"Orejeras", slot:"cabeza", layers:LAYOUT.items.orejeras},
  {id:"gorro",    name:"Gorro",    slot:"cabeza", layers:LAYOUT.items.gorro},
  {id:"chaleco",  name:"Chaleco",  slot:"cuerpo", layers:LAYOUT.items.chaleco},
  {id:"bolsito",  name:"Bolsito",  slot:"bolso",  layers:LAYOUT.items.bolsito},
  {id:"mitones",  name:"Mitones",  slot:"manos",  layers:LAYOUT.items.mitones},
  {id:"botas",    name:"Botas",    slot:"pies",   layers:LAYOUT.items.botas},
];
const byId = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const stage = document.getElementById('stage');
const itemsEl = document.getElementById('items');
const badge = document.getElementById('badge');
stage.style.aspectRatio = LAYOUT.ar[0]+' / '+LAYOUT.ar[1];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function place(img, key){
  const p = L[key];
  img.style.left = p.l+'%'; img.style.top = p.t+'%'; img.style.width = p.w+'%'; img.style.zIndex = Math.round(p.z*10);
}
const bodyEls = {};
for (const key of LAYOUT.body) {
  const im = new Image(); im.src='img/'+key+'.webp'; im.alt=''; place(im,key); stage.appendChild(im); bodyEls[key]=im;
}
// Layer order can depend on the outfit: with the scarf on, the vest goes under the chin
const zOf = k => L[k].z;
const bodyShown = k => !(LAYOUT.hideWhen[k] && wearing.has(LAYOUT.hideWhen[k]));
const layerEls = {};
for (const key of Object.keys(L)) {
  if (LAYOUT.body.includes(key)) continue;
  const im = new Image(); im.src = 'img/'+key+'.webp'; im.alt=''; im.className='layer'; im.hidden = true;
  place(im,key); stage.appendChild(im); layerEls[key]=im;
}

const buttons = {};
for (const it of ITEMS) {
  const b = document.createElement('button');
  b.type='button'; b.className='item'; b.id='item-'+it.id; b.setAttribute('aria-pressed','false');
  b.innerHTML = '<img src="img/t_'+it.id+'.webp" alt=""><span>'+it.name+'</span>';
  b.addEventListener('click',()=>toggle(it.id));
  itemsEl.appendChild(b); buttons[it.id]=b;
}

let wearing = new Set();
function render(changed){
  for (const it of ITEMS) {
    const on = wearing.has(it.id);
    buttons[it.id].setAttribute('aria-pressed', on);
    for (const k of it.layers) {
      const el = layerEls[k];
      el.hidden = !on;
      if (on && changed && changed.includes(it.id) && !reduce) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    }
  }
  for (const k of LAYOUT.body) bodyEls[k].hidden = !bodyShown(k);
  for (const k in layerEls) layerEls[k].style.zIndex = Math.round(zOf(k) * 10);
  for (const k in bodyEls) bodyEls[k].style.zIndex = Math.round(zOf(k) * 10);
  if (changed && changed.length && !reduce) { stage.classList.remove('boing'); void stage.offsetWidth; stage.classList.add('boing'); }
  badge.hidden = !(wearing.has('bufanda') && wearing.has('orejeras'));
}
function wear(id){
  const it = byId[id];
  for (const w of [...wearing]) if (byId[w].slot===it.slot) wearing.delete(w);
  wearing.add(id);
}
function toggle(id){
  if (wearing.has(id)) { wearing.delete(id); render([]); }
  else { wear(id); render([id]); }
}
document.getElementById('limpiar').addEventListener('click',()=>{ wearing.clear(); render([]); });
document.getElementById('sorpresa').addEventListener('click',()=>{
  wearing.clear();
  const slots = {};
  for (const it of ITEMS) (slots[it.slot] ??= []).push(it.id);
  const picked = [];
  for (const ids of Object.values(slots)) if (Math.random()<0.6) { const id = ids[Math.floor(Math.random()*ids.length)]; wear(id); picked.push(id); }
  if (!picked.length) { wear('gorro_fiesta'); picked.push('gorro_fiesta'); }
  render(picked);
});

// Photo: composite onto a canvas and show it as an image the viewer can long-press to save
const loaded = src => new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
document.getElementById('foto').addEventListener('click', async ()=>{
  const W=900, H=1200, sh=H-130, sw=sh*LAYOUT.ar[0]/LAYOUT.ar[1], ox=(W-sw)/2, oy=110;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  drawLandscape(g,W,H);
  const keys=LAYOUT.body.filter(bodyShown); for (const it of ITEMS) if (wearing.has(it.id)) keys.push(...it.layers);
  keys.sort((a,b)=>zOf(a)-zOf(b));
  try{
    for (const k of keys){ const im=await loaded('img/'+k+'.webp'); const p=L[k]; const w=sw*p.w/100; g.drawImage(im, ox+sw*p.l/100, oy+sh*p.t/100, w, w*im.naturalHeight/im.naturalWidth); }
    g.fillStyle='#1c4f78'; g.font='800 64px Sniglet, "Baloo 2", sans-serif'; g.textAlign='center'; g.fillText('Mi NODI', W/2, 92);
    document.getElementById('fotoimg').src=c.toDataURL('image/png');
    document.getElementById('sheet').hidden=false; document.getElementById('cerrar').focus();
  }catch(e){ console.error(e); }
});
document.getElementById('cerrar').addEventListener('click',()=>{ document.getElementById('sheet').hidden=true; document.getElementById('foto').focus(); });
document.getElementById('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet'){ e.currentTarget.hidden=true; } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('sheet').hidden=true; });

// Soft snowy hills and frosted trees, drawn once per size
function drawLandscape(g, W, H){
  const sky=g.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#c9def6'); sky.addColorStop(.55,'#e4eefb'); sky.addColorStop(1,'#f7fbff');
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  const u=W/100;
  const tree=(x,y,s,c)=>{ g.fillStyle=c; for(let i=0;i<3;i++){ const w=s*(1.15-i*.28), h=s*.62; g.beginPath(); g.ellipse(x, y-i*h*.62, w/2, h/2, 0, 0, Math.PI*2); g.fill(); } };
  g.save(); g.filter='blur('+Math.max(2,u*.9)+'px)';
  const far='rgba(233,241,252,.95)', near='rgba(248,251,255,.98)';
  [[6,46,14],[18,43,11],[30,47,9],[70,45,10],[82,42,13],[95,46,11]].forEach(([x,y,s])=>tree(x*u,y*H/100,s*u,far));
  [[2,58,17],[16,60,12],[86,58,15],[99,61,12]].forEach(([x,y,s])=>tree(x*u,y*H/100,s*u,near));
  g.fillStyle='#ffffff';
  g.beginPath(); g.ellipse(W*.25,H*.66,W*.55,H*.09,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(W*.85,H*.64,W*.5,H*.08,0,0,Math.PI*2); g.fill();
  g.restore();
  g.fillStyle='#ffffff'; g.fillRect(0,H*.7,W,H*.3);
  g.beginPath(); g.ellipse(W/2,H*.7,W*.75,H*.06,0,0,Math.PI*2); g.fill();
}
(function(){
  const cv=document.getElementById('paisaje'); const g=cv.getContext('2d');
  function size(){ const r=cv.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2); cv.width=r.width*d; cv.height=r.height*d; g.setTransform(d,0,0,d,0,0); drawLandscape(g,r.width,r.height); }
  addEventListener('resize',size); size();
})();

// Gentle snowfall behind NODI
(function(){
  const cv=document.getElementById('flakes'); const g=cv.getContext('2d'); let fl=[], W=0, H=0;
  function size(){ const r=cv.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2); W=r.width; H=r.height; cv.width=W*d; cv.height=H*d; g.setTransform(d,0,0,d,0,0);
    fl=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:1.5+Math.random()*3,s:.25+Math.random()*.5,d:Math.random()*6})); draw(0); }
  function draw(t){ g.clearRect(0,0,W,H); g.fillStyle='rgba(255,255,255,.9)';
    for(const f of fl){ g.beginPath(); g.arc(f.x+Math.sin(t/1600+f.d)*6,f.y,f.r,0,Math.PI*2); g.fill(); } }
  function tick(t){ for(const f of fl){ f.y+=f.s; if(f.y>H+5){f.y=-5; f.x=Math.random()*W;} } draw(t); requestAnimationFrame(tick); }
  addEventListener('resize',size); size(); if(!reduce) requestAnimationFrame(tick);
})();

// Keep the outfit across live updates
const start = data => { if (Array.isArray(data?.wearing)) data.wearing.forEach(id=>byId[id]&&wear(id)); render([]); };
window.claude?.hot?.snapshot?.(()=>({wearing:[...wearing]}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
